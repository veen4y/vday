<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle-fall 3s linear infinite;
            box-shadow: 0 0 10px white;
        }

        @keyframes sparkle-fall {
            0% {
                transform: translateY(-100vh) scale(0);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) scale(1);
                opacity: 0;
            }
        }

        .floating-hearts {
            position: fixed;
            font-size: 30px;
            opacity: 0;
            animation: float 8s ease-in infinite;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 60px 50px;
            border-radius: 50px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.4), 
                        inset 0 0 50px rgba(255, 255, 255, 0.5);
            text-align: center;
            max-width: 650px;
            width: 100%;
            position: relative;
            border: 5px solid rgba(255, 255, 255, 0.9);
            animation: container-glow 3s ease-in-out infinite;
        }

        @keyframes container-glow {
            0%, 100% {
                box-shadow: 0 40px 100px rgba(0, 0, 0, 0.4), 
                            inset 0 0 50px rgba(255, 255, 255, 0.5),
                            0 0 50px rgba(255, 105, 180, 0.3);
            }
            50% {
                box-shadow: 0 40px 100px rgba(0, 0, 0, 0.4), 
                            inset 0 0 50px rgba(255, 255, 255, 0.5),
                            0 0 80px rgba(255, 105, 180, 0.6);
            }
        }

        .heart {
            font-size: 100px;
            animation: heartbeat 1.5s ease-in-out infinite;
            margin-bottom: 20px;
            filter: drop-shadow(0 15px 30px rgba(245, 87, 108, 0.5));
            text-shadow: 0 0 30px rgba(255, 105, 180, 0.8);
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            10% { transform: scale(1.2) rotate(-5deg); }
            20% { transform: scale(1); }
            30% { transform: scale(1.2) rotate(5deg); }
            40% { transform: scale(1); }
        }

        h1 {
            font-size: 3.2em;
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 50%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 50px;
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow: 0 5px 20px rgba(245, 87, 108, 0.3);
            animation: title-shine 3s ease-in-out infinite;
            position: relative;
        }

        @keyframes title-shine {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .buttons {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 140px;
        }

        button {
            font-weight: 700;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
        }

        .yes-btn {
            padding: 30px 80px;
            font-size: 2.2em;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 15px 50px rgba(245, 87, 108, 0.6),
                        inset 0 -5px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
        }

        .yes-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shine 3s ease-in-out infinite;
        }

        @keyframes shine {
            0% { transform: rotate(0deg) translate(-50%, -50%); }
            100% { transform: rotate(360deg) translate(-50%, -50%); }
        }

        .yes-btn::after {
            content: '✨';
            position: absolute;
            top: -25px;
            right: -25px;
            font-size: 50px;
            animation: sparkle-rotate 2s ease-in-out infinite;
        }

        @keyframes sparkle-rotate {
            0%, 100% { transform: rotate(0deg) scale(0.8); opacity: 0.5; }
            50% { transform: rotate(180deg) scale(1.3); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { 
                transform: scale(1); 
                box-shadow: 0 15px 50px rgba(245, 87, 108, 0.6),
                            inset 0 -5px 20px rgba(0, 0, 0, 0.2);
            }
            50% { 
                transform: scale(1.1); 
                box-shadow: 0 20px 60px rgba(245, 87, 108, 0.8),
                            inset 0 -5px 20px rgba(0, 0, 0, 0.2),
                            0 0 40px rgba(255, 255, 255, 0.5);
            }
        }

        .yes-btn:hover {
            transform: scale(1.15) rotate(-2deg);
            box-shadow: 0 20px 70px rgba(245, 87, 108, 0.8);
        }

        .no-btn {
            padding: 16px 40px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            color: #333;
            position: absolute;
            white-space: nowrap;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .no-btn:hover {
            transform: scale(1.08);
        }

        .success, .invitation {
            display: none;
        }

        .success.show, .invitation.show {
            display: block;
            animation: fadeIn 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8) translateY(30px) rotate(-5deg); }
            to { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
        }

        .success h2 {
            font-size: 3.5em;
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 50%, #ffd89b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
            animation: bounce 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-weight: 900;
            letter-spacing: -1px;
        }

        .celebration-gif {
            width: 100%;
            max-width: 500px;
            border-radius: 30px;
            margin: 30px auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border: 6px solid rgba(255, 255, 255, 0.9);
            animation: image-float 3s ease-in-out infinite;
        }

        @keyframes image-float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .invitation h2 {
            font-size: 3em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 25px 0;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .invitation p {
            font-size: 1.5em;
            color: #444;
            margin: 20px 0;
            line-height: 2;
            font-style: italic;
        }

        .details {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
            padding: 40px;
            border-radius: 30px;
            margin: 35px 0;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2),
                        inset 0 0 30px rgba(255, 255, 255, 0.5);
            border: 4px solid rgba(255, 255, 255, 0.9);
            animation: detail-glow 3s ease-in-out infinite;
        }

        @keyframes detail-glow {
            0%, 100% {
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2),
                            inset 0 0 30px rgba(255, 255, 255, 0.5);
            }
            50% {
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2),
                            inset 0 0 30px rgba(255, 255, 255, 0.5),
                            0 0 50px rgba(255, 154, 158, 0.6);
            }
        }

        .time {
            font-size: 2em;
            font-weight: 900;
            color: #f5576c;
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .location {
            font-size: 1.7em;
            font-weight: 800;
            color: #764ba2;
            margin-top: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .restaurant-img {
            width: 100%;
            max-width: 550px;
            border-radius: 30px;
            margin: 30px auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border: 6px solid rgba(255, 255, 255, 0.9);
            display: block;
            animation: image-float 3s ease-in-out infinite;
        }

        .cute-emojis {
            display: flex;
            gap: 25px;
            justify-content: center;
            margin-top: 35px;
            flex-wrap: wrap;
        }

        .cute-emojis span {
            font-size: 80px;
            animation: emoji-bounce 2s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        .cute-emojis span:nth-child(1) {
            animation-delay: 0s;
        }

        .cute-emojis span:nth-child(2) {
            animation-delay: 0.3s;
        }

        .cute-emojis span:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes emoji-bounce {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(-10deg); }
            50% { transform: translateY(0px) rotate(0deg); }
            75% { transform: translateY(-10px) rotate(10deg); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            15% { transform: translateY(-30px) scale(1.1); }
            30% { transform: translateY(0) scale(1); }
            45% { transform: translateY(-15px) scale(1.05); }
            60% { transform: translateY(0) scale(1); }
        }

        .confetti {
            position: fixed;
            width: 15px;
            height: 15px;
            animation: confetti-fall 5s linear;
            z-index: 1000;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(1080deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }
            
            h1 {
                font-size: 2.2em;
            }
            
            .yes-btn {
                padding: 25px 60px;
                font-size: 1.8em;
            }
            
            .heart {
                font-size: 80px;
            }

            .cute-emojis span {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="question" id="question">
            <div class="heart">💕</div>
            <h1>Can you be my Valentine?</h1>
            <div class="buttons">
                <button class="yes-btn" onclick="handleYes()">Yes! 💖</button>
                <button class="no-btn" id="noBtn" onclick="handleNo()">No</button>
            </div>
        </div>
        
        <div class="success" id="success">
            <h2>Yay! 🎉</h2>
            <img class="celebration-gif" src="https://media.giphy.com/media/g9582DNuQppxC/giphy.gif" alt="🎊">
            <div class="cute-emojis">
                <span>😻</span>
                <span>🥰</span>
                <span>💖</span>
            </div>
        </div>

        <div class="invitation" id="invitation">
            <h2>You're Invited! 🍽️</h2>
            <p>Let's celebrate together! 💕</p>
            <div class="details">
                <p class="time">📅 12:00 PM</p>
                <p class="location">📍 La Loca Maria, Bandra</p>
            </div>
            <img class="restaurant-img" src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=800&q=80" alt="🍴">
            <div class="cute-emojis">
                <span>🌹</span>
                <span>🥂</span>
                <span>💑</span>
            </div>
        </div>
    </div>

    <script>
        const noTexts = [
            "Are you sure? 🥺",
            "Really? 😢",
            "Please? 🥹",
            "Don't do this 💔",
            "Think again! 😭",
            "You're breaking my heart 💔",
            "One more chance? 🙏",
            "Pretty please? 🥺"
        ];
        
        let noClickCount = 0;

        function createSparkles() {
            setInterval(() => {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 3 + 's';
                sparkle.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(sparkle);
                
                setTimeout(() => sparkle.remove(), 5000);
            }, 300);
        }

        function createFloatingHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'floating-hearts';
                heart.textContent = ['💕', '💖', '💗', '💝', '💓'][Math.floor(Math.random() * 5)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 2 + 's';
                heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
                document.body.appendChild(heart);
                
                setTimeout(() => heart.remove(), 8000);
            }, 600);
        }

        createSparkles();
        createFloatingHearts();

        function handleNo() {
            const noBtn = document.getElementById('noBtn');
            noClickCount++;
            
            if (noClickCount < noTexts.length) {
                noBtn.textContent = noTexts[noClickCount];
            }
            
            const container = document.querySelector('.buttons');
            const containerRect = container.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            
            const maxX = containerRect.width - btnRect.width - 100;
            const maxY = containerRect.height - btnRect.height;
            
            const randomX = (Math.random() - 0.5) * maxX;
            const randomY = (Math.random() - 0.5) * maxY;
            
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${Math.random() * 360}deg)`;
        }

        function handleYes() {
            document.getElementById('question').style.display = 'none';
            document.getElementById('success').classList.add('show');
            createConfetti();
            
            setTimeout(() => {
                document.getElementById('success').style.display = 'none';
                document.getElementById('invitation').classList.add('show');
            }, 4000);
        }

        function createConfetti() {
            const colors = ['#f093fb', '#f5576c', '#4facfe', '#00f2fe', '#ffd700', '#ff9a9e', '#96e6a1', '#ffecd2'];
            const shapes = ['circle', 'square'];
            
            for (let i = 0; i < 200; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confetti.style.width = (Math.random() * 10 + 10) + 'px';
                    confetti.style.height = confetti.style.width;
                    
                    if (shapes[Math.floor(Math.random() * shapes.length)] === 'circle') {
                        confetti.style.borderRadius = '50%';
                    }
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 15);
            }
        }
    </script>
</body>
</html>
