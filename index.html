<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fef3f3;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 182, 193, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 218, 224, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 240, 245, 0.4) 0%, transparent 50%);
            pointer-events: none;
        }

        .floating-hearts {
            position: fixed;
            font-size: 30px;
            opacity: 0;
            animation: float 8s ease-in infinite;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.3));
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        .container {
            background: white;
            padding: 70px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 700px;
            width: 100%;
            position: relative;
            border: 1px solid rgba(255, 192, 203, 0.3);
        }

        .heart {
            font-size: 100px;
            animation: heartbeat 1.5s ease-in-out infinite;
            margin-bottom: 30px;
            filter: drop-shadow(0 10px 20px rgba(255, 105, 180, 0.3));
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            10% { transform: scale(1.2) rotate(-5deg); }
            20% { transform: scale(1); }
            30% { transform: scale(1.2) rotate(5deg); }
            40% { transform: scale(1); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5em;
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 60px;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.2;
            animation: title-shine 3s ease-in-out infinite;
        }

        @keyframes title-shine {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .buttons {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 140px;
        }

        button {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .yes-btn {
            padding: 28px 75px;
            font-size: 2em;
            background: #d63384;
            color: white;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 10px 30px rgba(214, 51, 132, 0.3);
            position: relative;
        }

        .yes-btn::after {
            content: '✨';
            position: absolute;
            top: -25px;
            right: -25px;
            font-size: 50px;
            animation: sparkle-rotate 2s ease-in-out infinite;
        }

        @keyframes sparkle-rotate {
            0%, 100% { transform: rotate(0deg) scale(0.8); opacity: 0.5; }
            50% { transform: rotate(180deg) scale(1.3); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { 
                transform: scale(1); 
                box-shadow: 0 10px 30px rgba(214, 51, 132, 0.3);
            }
            50% { 
                transform: scale(1.08); 
                box-shadow: 0 15px 40px rgba(214, 51, 132, 0.5);
            }
        }

        .yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(214, 51, 132, 0.5);
        }

        .no-btn {
            padding: 16px 40px;
            font-size: 1.1em;
            background: #f8f9fa;
            color: #6c757d;
            position: absolute;
            white-space: nowrap;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .no-btn:hover {
            transform: scale(1.05);
        }

        .success, .invitation {
            display: none;
        }

        .success.show, .invitation.show {
            display: block;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .success h2 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5em;
            color: #d63384;
            margin: 30px 0;
            animation: bounce 0.8s ease-in-out;
            font-weight: 900;
        }

        .celebration-gif {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 20px;
            margin: 30px auto;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            display: block;
        }

        .celebration-gif.loading {
            min-height: 300px;
            background: linear-gradient(135deg, #ffeef0 0%, #ffe8ec 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .invitation h2 {
            font-family: 'Playfair Display', serif;
            font-size: 3em;
            color: #d63384;
            margin: 30px 0;
            font-weight: 900;
        }

        .invitation p {
            font-size: 1.4em;
            color: #6c757d;
            margin: 20px 0;
            line-height: 1.8;
        }

        .details {
            background: linear-gradient(135deg, #fff5f7 0%, #ffe8ec 100%);
            padding: 40px;
            border-radius: 20px;
            margin: 35px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 192, 203, 0.3);
        }

        .time {
            font-size: 1.8em;
            font-weight: 700;
            color: #d63384;
            margin: 15px 0;
        }

        .location {
            font-size: 1.5em;
            font-weight: 700;
            color: #d63384;
            margin-top: 20px;
        }

        .restaurant-img {
            width: 100%;
            max-width: 600px;
            height: 450px;
            object-fit: cover;
            border-radius: 20px;
            margin: 30px auto;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            display: block;
        }

        .cute-emojis {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .cute-emojis span {
            font-size: 80px;
            animation: emoji-bounce 2s ease-in-out infinite;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.1));
        }

        .cute-emojis span:nth-child(1) {
            animation-delay: 0s;
        }

        .cute-emojis span:nth-child(2) {
            animation-delay: 0.3s;
        }

        .cute-emojis span:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes emoji-bounce {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(-10deg); }
            50% { transform: translateY(0px) rotate(0deg); }
            75% { transform: translateY(-10px) rotate(10deg); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            15% { transform: translateY(-30px) scale(1.1); }
            30% { transform: translateY(0) scale(1); }
            45% { transform: translateY(-15px) scale(1.05); }
            60% { transform: translateY(0) scale(1); }
        }

        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            animation: confetti-fall 4s linear;
            z-index: 1000;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 50px 30px;
            }
            
            h1 {
                font-size: 2.5em;
            }
            
            .yes-btn {
                padding: 22px 55px;
                font-size: 1.7em;
            }
            
            .heart {
                font-size: 80px;
            }

            .cute-emojis span {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="question" id="question">
            <div class="heart">💕</div>
            <h1>Will you be my Valentine?</h1>
            <div class="buttons">
                <button class="yes-btn" onclick="handleYes()">Yes! 💖</button>
                <button class="no-btn" id="noBtn" onclick="handleNo()">No</button>
            </div>
        </div>
        
        <div class="success" id="success">
            <h2>Yay! 🎉</h2>
            <div style="font-size: 120px; margin: 30px 0;">
                😱🎊✨
            </div>
            <div class="cute-emojis">
                <span>😻</span>
                <span>🥰</span>
                <span>💖</span>
            </div>
        </div>

        <div class="invitation" id="invitation">
            <h2>You're Invited! 🍽️</h2>
            <p>Let's celebrate together! 💕</p>
            <div class="details">
                <p class="time">📅 12:00 PM</p>
                <p class="location">📍 La Loca Maria, Bandra</p>
            </div>
            <img class="restaurant-img" src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=800&q=80" alt="Restaurant">
            <div class="cute-emojis">
                <span>🌹</span>
                <span>🥂</span>
                <span>💑</span>
            </div>
        </div>
    </div>

    <script>
        const noTexts = [
            "Are you sure? 🥺",
            "Really? 😢",
            "Please? 🥹",
            "Don't do this 💔",
            "Think again! 😭",
            "You're breaking my heart 💔",
            "One more chance? 🙏",
            "Pretty please? 🥺"
        ];
        
        let noClickCount = 0;

        function createFloatingHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'floating-hearts';
                heart.textContent = ['💕', '💖', '💗', '💝', '💓'][Math.floor(Math.random() * 5)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 2 + 's';
                heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
                document.body.appendChild(heart);
                
                setTimeout(() => heart.remove(), 8000);
            }, 600);
        }

        createFloatingHearts();

        function handleNo() {
            const noBtn = document.getElementById('noBtn');
            noClickCount++;
            
            if (noClickCount < noTexts.length) {
                noBtn.textContent = noTexts[noClickCount];
            }
            
            const container = document.querySelector('.buttons');
            const containerRect = container.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            
            const maxX = containerRect.width - btnRect.width - 100;
            const maxY = containerRect.height - btnRect.height;
            
            const randomX = (Math.random() - 0.5) * maxX;
            const randomY = (Math.random() - 0.5) * maxY;
            
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${Math.random() * 360}deg)`;
        }

        function handleYes() {
            document.getElementById('question').style.display = 'none';
            document.getElementById('success').classList.add('show');
            createConfetti();
            
            setTimeout(() => {
                document.getElementById('success').style.display = 'none';
                document.getElementById('invitation').classList.add('show');
            }, 3500);
        }

        function createConfetti() {
            const colors = ['#f093fb', '#f5576c', '#4facfe', '#00f2fe', '#ffd700', '#ff9a9e', '#96e6a1', '#ffecd2', '#d63384', '#ffb6c1'];
            
            for (let i = 0; i < 150; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-20px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    confetti.style.width = (Math.random() * 10 + 8) + 'px';
                    confetti.style.height = confetti.style.width;
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 20);
            }
        }
    </script>
</body>
</html>
